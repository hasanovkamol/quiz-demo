<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QuizMaster PRO</title>
    <script>
      // GitHub Pages SPA trick:
      // Har qanday 404 holatida sessionStorage ga path saqlab
      // index.html ga redirect qilamiz (Angular SPA uni qayta tiklaydi)
      var pathSegmentsToKeep = 1; // /quiz-demo/ = 1 segment

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Yuklanmoqda...</p>
  </body>
</html>
