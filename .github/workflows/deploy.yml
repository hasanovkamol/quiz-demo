name: QuizMaster PRO GitHub Deployment (Pages & GHCR)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  deploy-github-pages:
    name: Deploy Angular & About UIs to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: quiz-ui/package-lock.json

      - name: Install Quiz UI Dependencies
        run: npm --prefix quiz-ui install --legacy-peer-deps

      - name: Build Angular SPA for Production
        run: npm --prefix quiz-ui run build -- --base-href /quiz-demo/

      - name: Copy About UI to Output Directory
        run: |
          mkdir -p quiz-ui/dist/quiz-app/browser/about
          cp -r about-ui/* quiz-ui/dist/quiz-app/browser/about/

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: quiz-ui/dist/quiz-app/browser
          branch: gh-pages

  publish-docker-ghcr:
    name: Publish Multi-Container Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and Push About UI Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./about-ui
          file: ./about-ui/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/about-ui:latest

      - name: Build and Push Gateway Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:latest
