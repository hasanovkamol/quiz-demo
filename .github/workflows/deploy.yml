name: QuizMaster PRO GitHub Deployment (Pages & GHCR)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  deploy-github-pages:
    name: Deploy Angular UI to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies
        run: npm --prefix ui install --legacy-peer-deps

      - name: Create runtime config.json with backend URL
        run: |
          cat > ui/public/config.json << EOF
          {
            "apiUrl": "${{ secrets.BACKEND_URL }}/api",
            "keycloak": {
              "url": "${{ secrets.BACKEND_URL }}/auth",
              "realm": "quizmaster-realm",
              "clientId": "quizmaster-app"
            }
          }
          EOF

      - name: Build Angular SPA for Production
        run: npm --prefix ui run build -- --base-href /quiz-demo/

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ui/dist/quiz-app/browser
          branch: gh-pages

  publish-docker-ghcr:
    name: Publish Multi-Container Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and Push Gateway Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:latest
